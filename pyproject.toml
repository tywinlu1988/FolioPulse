[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foliopulse-engine"
version = "0.2.0"
description = "FolioPulse — AI 驱动的投资标的推荐引擎"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
